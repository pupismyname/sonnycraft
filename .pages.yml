media:
  input: content/media
  output: /media
components:
  image:
    type: object
    label: Image
    fields:
      - name: image
        label: Image
        type: image
      - name: title
        label: Title of this image
        type: string
      - name: description
        label: Description for this image
        type: rich-text
content:
  - name: global
    label: Global
    type: file
    path: content/_data/global.json
    fields:
      - name: bio
        label: A little about yourself
        type: rich-text
        options:
          format: html
  - name: categories
    label: Categories
    type: file
    path: content/_data/categories.json
    list: true
    fields:
      - name: label
        label: Label
        type: string
        description: The pretty name for this category.
      - name: slug
        label: Slug
        type: string
        description: What appears in the URL for this category. Lowercase, no spaces or punctuation, but dashes are ok.
      - name: hidden
        label: Hide this category
        type: boolean
      - name: description
        label: Description
        type: rich-text
  - name: portfolio
    label: Portfolio
    type: collection
    filename: "{primary}.md"
    path: content/portfolio
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: published
        label: Publish
        type: boolean
        default: true
      - name: featured
        label: Feature
        type: boolean
        default: false
      - name: images
        label: Images
        component: image
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({index})"
      - name: body
        label: Description
        type: rich-text
      - name: references
        label: Reference images
        component: image
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({index})"
      - name: categories
        label: Categories
        type: reference
        options:
          collection: categories
          multiple: true
          search: "label,slug,description"