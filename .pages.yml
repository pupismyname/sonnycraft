media:
  input: content/media
  output: /media
components:
  image:
    type: object
    label: Image
    fields:
      - name: image
        label: Image
        type: image
        media: media
        rename: safe
      - name: title
        label: Title
        description: The title of this specific image.
        type: string
      - name: description
        label: Description
        description: The description for this specific image.
        type: rich-text
content:
  - name: global
    label: Global values
    type: file
    path: content/_data/global.json
    fields:
      - name: bio
        label: Bio
        type: rich-text
        description: A little about yourself.
        options:
          format: html
      - name: categories
        label: Categories
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{slug} ({label})"
        fields:
        - name: label
          label: Label
          type: string
          description: The pretty name for this category.
        - name: slug
          label: Slug
          type: string
          description: What appears in the URL for this category. Lowercase, no spaces or punctuation, but dashes are ok.
  - name: portfolio
    label: Portfolio
    type: collection
    filename: "{primary}.md"
    path: content/portfolio
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: published
        label: Published
        description: Ready to publish?
        type: boolean
        default: true
      - name: featured
        label: Featured
        description: Feature this item
        type: boolean
        default: false
      - name: images
        label: Images
        description: Images for this entry, best one first.
        component: image
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({index})"
      - name: references
        label: References
        description: References for this entry, if any.
        component: image
        list:
          collapsible:
            collapsed: true
            summary: "{title} ({index})"
      - name: body
        label: Body
        description: A description for this entry, or just write whatever.
        type: rich-text
      - name: tags
        label: Tags
        description: Categories for this entry.
        type: string
        list: true
